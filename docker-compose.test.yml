# Entorno de pruebas: PostgreSQL con una base de datos aparte (notes_test)
# para no ensuciar la base de desarrollo. Uso: docker compose -f docker-compose.test.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: notes-postgres-test
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes_test}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
    ports:
      - "5433:5432"
    volumes:
      - notes_test_pgdata:/var/lib/postgresql/data

volumes:
  notes_test_pgdata: